name: Backend CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure build and prod directories exist
        run: |
          mkdir -p /home/dev/project/backend/Build_dir
          mkdir -p /home/dev/project/backend/Prod_dir

      - name: Clean Build_dir
        run: rm -rf /home/dev/project/backend/Build_dir/*

      - name: Copy code to Build_dir
        run: cp -r $GITHUB_WORKSPACE/* /home/dev/project/backend/Build_dir/

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: /home/dev/project/backend/Build_dir/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies and build
        working-directory: /home/dev/project/backend/Build_dir
        run: |
          npm install
          npm run build

      - name: Deploy to Prod_dir
        if: success()
        run: |
          rm -rf /home/dev/project/backend/Prod_dir/*
          cp -r /home/dev/project/backend/Build_dir/* /home/dev/project/backend/Prod_dir/

      - name: Copy env file
        run: cp /home/dev/project/backend/prod.env /home/dev/project/backend/Prod_dir/.env

      - name: Restart backend service
        working-directory: /home/dev/project/backend/Prod_dir
        run: |
          /usr/local/bin/pm2 delete backend || true
          /usr/local/bin/pm2 start npm --name backend -- run start -- --host 0.0.0.0
          /usr/local/bin/pm2 save
