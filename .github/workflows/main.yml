name: Backend CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ensure build and prod directories exist
      - name: Ensure build and prod directories exist
        run: |
          mkdir -p /home/dev/project/backend/Build_dir
          mkdir -p /home/dev/project/backend/Prod_dir

      # Clean Build_dir
      - name: Clean Build_dir
        run: |
          rm -rf /home/dev/project/backend/Build_dir/*

      # Copy repo files to Build_dir
      - name: Copy code to Build_dir
        run: |
          rsync -a --delete $GITHUB_WORKSPACE/ /home/dev/project/backend/Build_dir/

      # Install dependencies and build
      - name: Install dependencies and build
        working-directory: /home/dev/project/backend/Build_dir
        run: |
          npm install
          npm run build

      # Deploy only if build succeeds
      - name: Deploy to Prod_dir
        if: success()
        run: |
          rsync -a --delete /home/dev/project/backend/Build_dir/ /home/dev/project/backend/Prod_dir/

      # Restart backend with PM2 (using full path)
      - name: Restart backend service
        working-directory: /home/dev/project/backend/Prod_dir
        run: |
          /usr/local/bin/pm2 delete backend || true
          /usr/local/bin/pm2 start npm --name backend -- run start -- --host 0.0.0.0
          /usr/local/bin/pm2 save
