name: Backend CI/CD

on:
  push:
    branches: ["main"]   # adjust if you want another branch
  pull_request:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Make sure directories exist
      - name: Ensure build and prod directories exist
        run: |
          mkdir -p /home/dev/project/backend/Build_dir
          mkdir -p /home/dev/project/backend/Prod_dir

      # Clean Build_dir before copying new code
      - name: Clean Build_dir
        run: |
          rm -rf /home/dev/project/backend/Build_dir/*

      # Copy repository contents from runner to Build_dir
      - name: Copy code to Build_dir
        run: |
          rsync -a --delete $GITHUB_WORKSPACE/ /home/dev/project/backend/Build_dir/

      # Install dependencies and build
      - name: Install dependencies and build
        working-directory: /home/dev/project/backend/Build_dir
        run: |
          npm install
          npm run build

      # Deploy only if build was successful
      - name: Deploy to Prod_dir
        if: success()
        run: |
          rsync -a --delete /home/dev/project/backend/Build_dir/ /home/dev/project/backend/Prod_dir/

      # Run backend on all interfaces (0.0.0.0)
      - name: Run backend
        working-directory: /home/dev/project/backend/Prod_dir
        run: |
          npm run dev -- --host 0.0.0.0
 
